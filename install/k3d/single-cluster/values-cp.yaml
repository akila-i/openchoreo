# Helm values for OpenChoreo Control Plane in k3d single-cluster setup
# Note: devMode disables HTTPS, port adds :8080 to URLs for k3d port mapping

global:
  baseDomain: openchoreo.localhost
  devMode: true
  # Port suffix for URLs (k3d maps host:8080 -> container:80)
  port: ":8080"
  # Use k3d's built-in Traefik ingress class
  ingressClassName: traefik

# Disable helm chart's Traefik (use k3d's built-in Traefik instead)
traefik:
  enabled: false

# Enable cluster gateway for agent-based data plane communication
clusterGateway:
  enabled: true

# Controller Manager cluster gateway configuration
# Enables controllers to communicate with data/build planes via cluster gateway
controllerManager:
  clusterGateway:
    enabled: true

thunder:
  configuration:
    server:
      publicUrl: "http://thunder.openchoreo.localhost:8080"
    gateClient:
      hostname: "thunder.openchoreo.localhost"
      port: 8080
      scheme: "http"
  image:
    tag: latest-dev

openchoreoApi:
  logLevel: info
  ingress:
    enabled: true
    hosts:
      - host: api.openchoreo.localhost
        paths:
          - path: /
            pathType: Prefix

backstage:
  enabled: true
  image:
    tag: latest-dev
  ingress:
    enabled: true
    hosts:
      - host: openchoreo.localhost
        paths:
          - path: /
            pathType: Prefix
  baseUrl: http://openchoreo.localhost:8080

asgardeoThunder:
  ingress:
    enabled: true
    hosts:
      - host: thunder.openchoreo.localhost
        paths:
          - path: /
            pathType: Prefix
            port: 8090

  backstagePortal:
    enabled: true
    redirectUrls:
      - "http://localhost:3000/api/auth/default-idp/handler/frame"
      - "http://localhost:7007/api/auth/default-idp/handler/frame"
      - "http://openchoreo.localhost:8080/api/auth/default-idp/handler/frame"
